<!-- /html/home.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>linktour • home</title>

    <link rel="stylesheet" href="../css/home.css" />
    <!-- Leaflet (somente CSS por enquanto; o JS entra depois) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
<!-- toggle do mapa (CSS-only) -->
<input id="mapCollapse" class="ui-toggle" type="checkbox" />

<header>
    <div class="title" onclick="goHome()" role="button" tabindex="0">linktour</div>

    <div class="hdr-actions">
        <button class="avatar-btn" id="hdrAvatarBtn" type="button" onclick="toggleUserMenu()">
            <img id="hdrAvatarImg" alt="Avatar do usuário" />
        </button>

        <button class="hdr-btn" id="btnEntrar" type="button" onclick="goEntrar()">Entrar</button>
    </div>
</header>

<main>
    <div class="layout" aria-label="home-layout">
        <!-- mapa -->
        <aside class="col map-col" aria-label="mapa">
            <section class="panel map-panel">
                <div class="panel-top">
                    <div class="panel-title">Mapa</div>
                    <label class="hdr-btn panel-toggle" for="mapCollapse" role="button" tabindex="0">Expandir/Recolher</label>
                </div>

                <div class="map-body">
                    <div id="map" class="map-frame" aria-label="Mapa interativo"></div>
                    <div class="mini map-mini">Eventos serão centralizados aqui quando você tocar em um card.</div>
                </div>
            </section>
        </aside>

        <!-- feed -->
        <section class="col feed-col" aria-label="feed">
            <section class="hero hero-compact">
                <div class="hero-title">Descubra eventos e lugares</div>
                <div class="hero-sub">Use filtros na lateral e toque nos cards para focar no mapa.</div>
                <div class="mini" id="lastUpdate"></div>
            </section>

            <section class="panel feed-panel" aria-label="conteúdo">
                <div class="content">
                    <div class="error" id="pageError"></div>
                    <div class="notice" id="pageNotice"></div>

                    <div class="list" id="listaPublicacoes"></div>
                </div>
            </section>
        </section>

        <!-- filtros -->
        <aside class="col filters-col" aria-label="filtros">
            <section class="panel filters-panel">
                <div class="panel-top">
                    <div class="panel-title">Filtros</div>
                </div>

                <div class="content">
                    <div class="row">
                        <label>Busca</label>
                        <input id="q" type="search" placeholder="Buscar eventos, lugares, cidade..." />
                    </div>

                    <div class="row">
                        <label>Cidade</label>
                        <input id="cidade" type="text" placeholder="Ex: Caraguatatuba" />
                        <div class="mini" id="hintCidade"></div>
                    </div>

                    <div class="grid2">
                        <div class="row">
                            <label>De</label>
                            <input id="de" type="date" />
                        </div>
                        <div class="row">
                            <label>Até</label>
                            <input id="ate" type="date" />
                        </div>
                    </div>

                    <div class="row">
                        <label>Ordenar</label>
                        <select id="sort">
                            <option value="recentes">Mais recentes</option>
                            <option value="proximos">Mais próximos (por data)</option>
                            <option value="titulo">Título (A-Z)</option>
                        </select>
                    </div>

                    <div class="row row-actions">
                        <button class="btn primary" type="button" onclick="applyFilters()">Aplicar</button>
                        <button class="btn" type="button" onclick="clearFilters()">Limpar</button>
                    </div>

                    <div class="mini">Notas: autor e avatar são links para <code>./usuario.html?id=...</code></div>
                </div>
            </section>
        </aside>

    </div>
</main>

<!-- menu usuário -->
<div class="user-menu-bg" id="userMenuBg">
    <div class="user-menu" id="userMenu" onclick="event.stopPropagation()">
        <div class="um-header">
            <img id="umAvatarImg" class="um-avatar" alt="Avatar do usuário" />
            <div>
                <div class="um-name" id="umName">Usuário</div>
                <div class="um-mini" id="umCity">—</div>
            </div>
        </div>

        <div class="um-items">
            <button class="um-item" type="button" onclick="goPerfil()">Perfil</button>
            <button class="um-item exit" type="button" onclick="logout()">Sair</button>
        </div>
    </div>
</div>

<script src="../js/home.js"></script>
</body>
</html>
